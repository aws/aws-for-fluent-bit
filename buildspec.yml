version: 0.2
phases:
  install:
    runtime-versions:
      golang: 1.23
      python: 3.x
  pre_build:
    commands:
      - echo Building the AWS for Fluent Bit image
      # Check BUILD_VERSION environment variable and set default if not provided
      # TODO: Remove default once codepipeline and buildspec setup is complete end to end for new builds
      - |
        if [ -z "$BUILD_VERSION" ]; then
          echo "BUILD_VERSION environment variable not provided, defaulting to BUILD_VERSION=2"
          export BUILD_VERSION=2
        else
          echo "BUILD_VERSION is set to: $BUILD_VERSION"
        fi
  build:
    commands:
      # Execute the build script which handles both BUILD_VERSION 2 and 3
      - ./scripts/build.sh

artifacts:
  files:
    - '**/*'