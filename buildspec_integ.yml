version: 0.2
phases:
  install:
    runtime-versions:
      golang: 1.23
  pre_build:
    commands:
      - echo Running the integration test
      - |
        if [ -z "$BUILD_VERSION" ]; then
          echo "BUILD_VERSION environment variable not provided, defaulting to BUILD_VERSION=2"
          export BUILD_VERSION=2
        else
          echo "BUILD_VERSION is set to: $BUILD_VERSION"
        fi
  build:
    commands:
      # Execute the build script which handles both BUILD_VERSION 2 and 3
      - ./scripts/run_integ_tests.sh

artifacts:
  files:
    - '**/*'
